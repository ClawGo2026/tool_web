<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSON 表格生成器</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #242836;
    --border: #2e3348;
    --text: #e4e6f0;
    --text2: #8b8fa8;
    --accent: #6c5ce7;
    --accent2: #a29bfe;
    --green: #00cec9;
    --red: #ff6b6b;
    --radius: 12px;
    --shadow: 0 4px 24px rgba(0,0,0,.3);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans SC', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 20px;
  }

  .header { text-align:center; margin-bottom:24px; }
  .header h1 {
    font-size:1.5rem; font-weight:700;
    background:linear-gradient(135deg,var(--accent2),var(--green));
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    margin-bottom:4px;
  }
  .header p { color:var(--text2); font-size:.82rem; }

  .container {
    max-width:1400px; margin:0 auto;
    display:flex; flex-direction:column; gap:20px;
  }
  @media(min-width:900px){
    .container{flex-direction:row;}
    .panel-input{width:340px;flex-shrink:0;}
    .panel-table{flex:1;min-width:0;}
  }

  .panel{
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius); padding:20px; box-shadow:var(--shadow);
  }
  .panel-title{
    font-size:.78rem; text-transform:uppercase; letter-spacing:.08em;
    color:var(--text2); margin-bottom:14px;
    display:flex; align-items:center; gap:6px;
  }
  .panel-title::before{
    content:''; width:3px; height:14px;
    background:var(--accent); border-radius:2px;
  }

  textarea{
    width:100%; height:200px; background:var(--surface2);
    border:1px solid var(--border); border-radius:8px;
    color:var(--text); font-family:'JetBrains Mono','Fira Code',monospace;
    font-size:.82rem; padding:14px; resize:vertical; outline:none;
    transition:border-color .2s; line-height:1.5;
  }
  textarea:focus{border-color:var(--accent);}
  textarea::placeholder{color:var(--text2);opacity:.6;}

  .controls{
    display:flex; flex-wrap:wrap; gap:10px;
    margin-top:14px; align-items:center;
  }
  .btn{
    padding:8px 16px; border:none; border-radius:8px;
    font-size:.82rem; font-weight:600; cursor:pointer;
    transition:all .2s; display:flex; align-items:center; gap:6px;
    white-space:nowrap;
  }
  .btn-primary{
    background:linear-gradient(135deg,var(--accent),#845ef7); color:#fff;
  }
  .btn-primary:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(108,92,231,.4);}
  .btn-outline{
    background:transparent; border:1px solid var(--border); color:var(--text2);
  }
  .btn-outline:hover{
    border-color:var(--accent); color:var(--accent2);
    background:rgba(108,92,231,.08);
  }
  .btn-sample{
    background:transparent; border:1px dashed var(--border);
    color:var(--text2); font-size:.78rem;
  }
  .btn-sample:hover{border-color:var(--green);color:var(--green);}

  .unit-row{
    display:flex; align-items:center; gap:8px; margin-top:12px;
  }
  .unit-row label{font-size:.78rem;color:var(--text2);white-space:nowrap;}
  .text-input{
    flex:1; background:var(--surface2); border:1px solid var(--border);
    border-radius:8px; color:var(--text); font-size:.82rem;
    padding:7px 12px; outline:none; transition:border-color .2s;
  }
  .text-input:focus{border-color:var(--accent);}

  .error-msg{color:var(--red);font-size:.78rem;margin-top:8px;min-height:1.2em;}

  /* Palette picker */
  .palette-section{margin-top:14px;}
  .palette-label{font-size:.78rem;color:var(--text2);margin-bottom:8px;}
  .palette-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(100px, 1fr));
    gap:8px;
  }
  .palette-card{
    border:2px solid transparent; border-radius:8px;
    padding:8px; cursor:pointer; transition:all .2s;
    background:var(--surface2); display:flex; flex-direction:column; gap:4px;
    align-items:center;
  }
  .palette-card:hover{border-color:rgba(255,255,255,.15);}
  .palette-card.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);}
  .palette-name{font-size:.68rem;color:var(--text2);text-align:center;}
  .palette-preview{
    width:100%; height:22px; border-radius:4px; overflow:hidden;
    display:flex;
  }
  .palette-preview div{flex:1;}

  /* Table style picker */
  .tablestyle-section{margin-top:14px;}
  .tablestyle-label{font-size:.78rem;color:var(--text2);margin-bottom:8px;}
  .tablestyle-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(80px, 1fr));
    gap:6px;
  }
  .tablestyle-card{
    border:2px solid transparent; border-radius:8px;
    padding:8px 6px; cursor:pointer; transition:all .2s;
    background:var(--surface2); display:flex; flex-direction:column;
    align-items:center; gap:4px;
  }
  .tablestyle-card:hover{border-color:rgba(255,255,255,.15);}
  .tablestyle-card.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);}
  .tablestyle-name{font-size:.65rem;color:var(--text2);text-align:center;}
  .tablestyle-icon{
    width:44px; height:28px; border-radius:3px; overflow:hidden;
    display:flex; flex-direction:column;
  }

  /* Table area */
  .table-wrapper{
    position:relative; overflow-x:auto; border-radius:8px;
    min-height:200px;
  }
  .table-title{
    text-align:center; font-weight:700; margin-bottom:16px;
    letter-spacing:.02em;
  }

  .empty-state{
    display:flex; flex-direction:column; align-items:center;
    justify-content:center; height:300px; color:var(--text2); gap:12px;
  }
  .empty-state svg{opacity:.3;}
  .empty-state p{font-size:.85rem;}

  /* Stats */
  .stats{
    display:flex; flex-wrap:wrap; gap:16px;
    margin-top:16px; padding-top:16px;
    border-top:1px solid var(--border);
  }
  .stat-item{text-align:center;}
  .stat-value{font-size:1.1rem;font-weight:700;color:var(--accent2);}
  .stat-label{font-size:.7rem;color:var(--text2);margin-top:2px;}

  /* Disclaimer */
  .table-disclaimer{
    text-align:right; font-size:.68rem; color:var(--text2);
    margin-top:10px; opacity:.55;
  }

  /* Toolbar */
  .table-toolbar{
    display:flex; justify-content:flex-end; gap:8px;
    margin-bottom:10px;
  }
  .toolbar-btn{
    background:var(--surface2); border:1px solid var(--border);
    border-radius:8px; color:var(--text2); padding:6px 12px;
    font-size:.75rem; cursor:pointer; transition:all .2s;
    display:flex; align-items:center; gap:5px;
  }
  .toolbar-btn:hover{border-color:var(--accent);color:var(--accent2);}

  /* Fullscreen */
  .fullscreen-wrapper{
    position:fixed; inset:0; z-index:9999;
    background:var(--bg); padding:20px;
    display:none; flex-direction:column;
    overflow:auto;
  }
  .fullscreen-wrapper.active{display:flex;}
  .fullscreen-header{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:16px; flex-shrink:0;
    transition: opacity .4s, transform .4s;
  }
  .fullscreen-header.auto-hide{
    opacity:0; transform:translateY(-100%); pointer-events:none;
  }
  .fullscreen-header.auto-hide:hover{
    opacity:1; transform:translateY(0); pointer-events:auto;
  }
  .fullscreen-header h2{font-size:1.1rem; color:var(--text);}
  .btn-close-fs{
    background:var(--surface2); border:1px solid var(--border);
    border-radius:8px; color:var(--text2); padding:8px 16px;
    font-size:.82rem; cursor:pointer; transition:all .2s;
    display:flex; align-items:center; gap:6px;
  }
  .btn-close-fs:hover{border-color:var(--red);color:var(--red);}
  .fullscreen-content{flex:1;overflow:auto;}

  /* ── Dynamic Table Styles ── */
  /* These classes are set by JS based on selected style & palette */
  .gen-table{width:100%;border-collapse:collapse;font-size:.85rem;line-height:1.6;}
  .gen-table th,.gen-table td{padding:10px 14px;text-align:left;transition:background .15s;}
  .gen-table th{font-weight:700;white-space:nowrap;}
  .gen-table td{white-space:nowrap;}

  /* Column resize handle */
  .col-resize-handle{
    position:absolute; top:0; right:-2px; width:5px; height:100%;
    cursor:col-resize; z-index:2; user-select:none;
  }
  .col-resize-handle:hover,.col-resize-handle.active{background:rgba(108,92,231,.3);}
</style>
</head>
<body>

<div class="header">
  <h1>📋 JSON 表格生成器</h1>
  <p>输入 JSON 数据，一键生成精美数据表格</p>
</div>

<div class="container">
  <!-- Input Panel -->
  <div class="panel panel-input">
    <div class="panel-title">数据输入</div>
    <textarea id="jsonInput" placeholder='输入 JSON 数组，例如：
[
  {"姓名": "张三", "年龄": 28, "城市": "北京"},
  {"姓名": "李四", "年龄": 35, "城市": "上海"},
  {"姓名": "王五", "年龄": 42, "城市": "深圳"}
]'></textarea>
    <div class="error-msg" id="errorMsg"></div>
    <div class="controls">
      <button class="btn btn-primary" onclick="renderTable()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
        生成表格
      </button>
      <button class="btn btn-sample" onclick="loadSample()">📊 示例数据</button>
    </div>
    <div class="unit-row">
      <label>表格标题：</label>
      <input type="text" class="text-input" id="titleInput" placeholder="如：2024年度员工数据" oninput="onTitleChange()">
    </div>

    <div class="palette-section">
      <div class="palette-label">配色方案</div>
      <div class="palette-grid" id="paletteGrid"></div>
    </div>
    <div class="tablestyle-section">
      <div class="tablestyle-label">表格样式</div>
      <div class="tablestyle-grid" id="tablestyleGrid"></div>
    </div>
  </div>

  <!-- Table Panel -->
  <div class="panel panel-table">
    <div class="panel-title">数据表格</div>
    <div class="table-toolbar" id="tableToolbar" style="display:none;">
      <button class="toolbar-btn" onclick="toggleFullscreen()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 00-2 2v3m18 0V5a2 2 0 00-2-2h-3m0 18h3a2 2 0 002-2v-3M3 16v3a2 2 0 002 2h3"/></svg>
        全屏展示
      </button>
    </div>
    <div class="table-wrapper" id="tableWrapper">
      <div class="empty-state" id="emptyState">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
        <p>输入数据后点击「生成表格」</p>
      </div>
      <div id="tableContent" style="display:none;"></div>
      <div class="table-disclaimer" id="tableDisclaimer" style="display:none;">* 数据来源于网络，仅供参考</div>
    </div>
    <div class="stats" id="statsBar" style="display:none;">
      <div class="stat-item"><div class="stat-value" id="statRows">-</div><div class="stat-label">行数</div></div>
      <div class="stat-item"><div class="stat-value" id="statCols">-</div><div class="stat-label">列数</div></div>
      <div class="stat-item"><div class="stat-value" id="statNumCols">-</div><div class="stat-label">数值列</div></div>
      <div class="stat-item"><div class="stat-value" id="statFields">-</div><div class="stat-label">字段</div></div>
    </div>
  </div>
</div>

<!-- Fullscreen overlay -->
<div class="fullscreen-wrapper" id="fullscreenWrapper">
  <div class="fullscreen-header">
    <h2>📋 数据表格</h2>
    <button class="btn-close-fs" onclick="toggleFullscreen()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      退出全屏
    </button>
  </div>
  <div class="fullscreen-content" id="fsContent"></div>
</div>

<script>
// ── State ──
let tableData = null;
let currentPalette = 0;
let currentStyle = 0;
let isFullscreen = false;

// ── Palettes ──
const PALETTES = [
  // Dark palettes
  {
    name: '梦幻紫', type:'dark',
    bg:'#1a1028', surface:'#241a3a', headerBg:'#2d1f4e', headerText:'#c8b8f0',
    rowBg1:'#1e1430', rowBg2:'#241a3a', rowText:'#d0c4ee', border:'#3a2860',
    hoverBg:'#322455', accent:'#a29bfe'
  },
  {
    name: '深邃蓝', type:'dark',
    bg:'#0a1628', surface:'#101e34', headerBg:'#142844', headerText:'#90b8e0',
    rowBg1:'#0e1a2e', rowBg2:'#121f36', rowText:'#b0cce8', border:'#1e3454',
    hoverBg:'#1a2e4a', accent:'#74b9ff'
  },
  {
    name: '暗夜绿', type:'dark',
    bg:'#0c1a14', surface:'#122418', headerBg:'#163020', headerText:'#80c8a0',
    rowBg1:'#0e1e16', rowBg2:'#122418', rowText:'#a0d8b8', border:'#1e4030',
    hoverBg:'#183028', accent:'#55efc4'
  },
  {
    name: '暗夜金', type:'dark',
    bg:'#141008', surface:'#1e1a10', headerBg:'#2a2210', headerText:'#e0c860',
    rowBg1:'#181408', rowBg2:'#1e1a10', rowText:'#d8c878', border:'#3a3018',
    hoverBg:'#282018', accent:'#f9ca24'
  },
  {
    name: '酒红', type:'dark',
    bg:'#1a0a0a', surface:'#241010', headerBg:'#3a1414', headerText:'#e09090',
    rowBg1:'#200e0e', rowBg2:'#281212', rowText:'#d8a8a8', border:'#4a2020',
    hoverBg:'#341818', accent:'#ff6b6b'
  },
  {
    name: '莫兰迪', type:'dark',
    bg:'#1a1918', surface:'#222120', headerBg:'#2e2d2a', headerText:'#c0b8b0',
    rowBg1:'#1e1d1c', rowBg2:'#242322', rowText:'#b8b0a8', border:'#3a3836',
    hoverBg:'#2e2c2a', accent:'#b8a9c9'
  },
  {
    name: '碳黑', type:'dark',
    bg:'#111111', surface:'#1a1a1a', headerBg:'#222222', headerText:'#cccccc',
    rowBg1:'#161616', rowBg2:'#1e1e1e', rowText:'#bbbbbb', border:'#333333',
    hoverBg:'#282828', accent:'#888888'
  },
  // Light palettes
  {
    name: '纯白简约', type:'light',
    bg:'#ffffff', surface:'#fafafa', headerBg:'#f0f0f0', headerText:'#333333',
    rowBg1:'#ffffff', rowBg2:'#f8f8f8', rowText:'#444444', border:'#e0e0e0',
    hoverBg:'#f0f5ff', accent:'#6c5ce7'
  },
  {
    name: '浅灰优雅', type:'light',
    bg:'#f5f6fa', surface:'#f0f1f5', headerBg:'#e8e9ef', headerText:'#2d3436',
    rowBg1:'#f5f6fa', rowBg2:'#ecedf2', rowText:'#444444', border:'#d8d9e0',
    hoverBg:'#e8ecf5', accent:'#6c5ce7'
  },
  {
    name: '天空蓝', type:'light',
    bg:'#f0f6fd', surface:'#eaf2fa', headerBg:'#dce8f5', headerText:'#1a3a5a',
    rowBg1:'#f0f6fd', rowBg2:'#e8f0f8', rowText:'#2a4a6a', border:'#c8d8e8',
    hoverBg:'#dce8f5', accent:'#0984e3'
  },
  {
    name: '薄荷绿', type:'light',
    bg:'#f0faf6', surface:'#eaf8f2', headerBg:'#dcf0e8', headerText:'#1a3a2a',
    rowBg1:'#f0faf6', rowBg2:'#e8f4ee', rowText:'#2a4a3a', border:'#c0e0d0',
    hoverBg:'#dceee4', accent:'#00b894'
  },
  {
    name: '暖阳米白', type:'light',
    bg:'#fdf8f0', surface:'#f8f2e8', headerBg:'#f0e8d8', headerText:'#4a3a20',
    rowBg1:'#fdf8f0', rowBg2:'#f8f0e0', rowText:'#5a4a30', border:'#e0d0b8',
    hoverBg:'#f0e8d0', accent:'#e17055'
  },
  {
    name: '樱花粉', type:'light',
    bg:'#fef5f8', surface:'#faf0f4', headerBg:'#f5e0ea', headerText:'#4a2030',
    rowBg1:'#fef5f8', rowBg2:'#faeef2', rowText:'#5a3040', border:'#e8c8d8',
    hoverBg:'#f5e0ea', accent:'#e84393'
  }
];

// ── Table Styles ──
const TABLE_STYLES = [
  {
    name: '经典线框',
    icon: (pal) => {
      const b = pal.border; const h = pal.headerBg;
      return `<div style="background:${pal.bg};padding:2px 3px;">
        <div style="background:${h};height:4px;border-bottom:1px solid ${b};margin-bottom:2px;"></div>
        <div style="height:3px;border-bottom:1px solid ${b};margin-bottom:2px;"></div>
        <div style="height:3px;border-bottom:1px solid ${b};"></div>
      </div>`;
    },
    apply: (table, pal) => {
      table.style.borderCollapse = 'collapse';
      const css = `
        .gen-table th { background:${pal.headerBg}; color:${pal.headerText}; border-bottom:2px solid ${pal.border}; font-weight:700; }
        .gen-table td { color:${pal.rowText}; border-bottom:1px solid ${pal.border}; }
        .gen-table tr:nth-child(even) td { background:${pal.rowBg2}; }
        .gen-table tr:nth-child(odd) td { background:${pal.rowBg1}; }
        .gen-table tr:hover td { background:${pal.hoverBg}; }
      `;
      return css;
    }
  },
  {
    name: '斑马条纹',
    icon: (pal) => {
      return `<div style="background:${pal.bg};padding:2px 3px;">
        <div style="background:${pal.headerBg};height:4px;margin-bottom:2px;"></div>
        <div style="background:${pal.rowBg2};height:3px;margin-bottom:2px;"></div>
        <div style="background:${pal.rowBg1};height:3px;margin-bottom:2px;"></div>
        <div style="background:${pal.rowBg2};height:3px;"></div>
      </div>`;
    },
    apply: (table, pal) => {
      table.style.borderCollapse = 'collapse';
      const css = `
        .gen-table th { background:${pal.headerBg}; color:${pal.headerText}; font-weight:700; }
        .gen-table td { color:${pal.rowText}; }
        .gen-table tr:nth-child(even) td { background:${pal.rowBg2}; }
        .gen-table tr:nth-child(odd) td { background:${pal.rowBg1}; }
        .gen-table tr:hover td { background:${pal.hoverBg}; }
        .gen-table th,.gen-table td { border:none; }
      `;
      return css;
    }
  },
  {
    name: '现代卡片',
    icon: (pal) => {
      return `<div style="background:${pal.bg};padding:2px 3px;">
        <div style="background:${pal.headerBg};height:4px;border-radius:2px 2px 0 0;margin-bottom:2px;"></div>
        <div style="background:${pal.rowBg1};height:3px;border-radius:0 0 2px 2px;margin-bottom:2px;border:1px solid ${pal.border};border-top:none;"></div>
        <div style="background:${pal.rowBg1};height:3px;border-radius:2px;border:1px solid ${pal.border};"></div>
      </div>`;
    },
    apply: (table, pal) => {
      table.style.borderCollapse = 'separate';
      table.style.borderSpacing = '0 4px';
      const css = `
        .gen-table th { background:${pal.headerBg}; color:${pal.headerText}; font-weight:700; border-radius:0; }
        .gen-table th:first-child { border-radius:6px 0 0 6px; }
        .gen-table th:last-child { border-radius:0 6px 6px 0; }
        .gen-table td { background:${pal.rowBg1}; color:${pal.rowText}; }
        .gen-table td:first-child { border-radius:6px 0 0 6px; }
        .gen-table td:last-child { border-radius:0 6px 6px 0; }
        .gen-table tr:hover td { background:${pal.hoverBg}; }
        .gen-table th,.gen-table td { border:none; }
      `;
      return css;
    }
  },
  {
    name: '简约无线',
    icon: (pal) => {
      return `<div style="background:${pal.bg};padding:2px 3px;">
        <div style="background:${pal.headerBg};height:4px;border-bottom:2px solid ${pal.accent};margin-bottom:3px;"></div>
        <div style="height:3px;margin-bottom:3px;"></div>
        <div style="height:3px;margin-bottom:3px;"></div>
        <div style="height:3px;"></div>
      </div>`;
    },
    apply: (table, pal) => {
      table.style.borderCollapse = 'collapse';
      const css = `
        .gen-table th { background:${pal.headerBg}; color:${pal.headerText}; font-weight:700; border-bottom:2px solid ${pal.accent}; }
        .gen-table td { color:${pal.rowText}; border:none; }
        .gen-table tr:nth-child(even) td { background:${pal.rowBg2}; }

        <div style="display:flex;gap:1px;"><div style="flex:1;height:3px;border:1px solid ${b};"></div><div style="flex:1;height:3px;border:1px solid ${b};"></div></div>

// ── Init ──
function init() {
  buildPaletteGrid();
  buildTableStyleGrid();
}

function buildPaletteGrid() {
  const grid = document.getElementById('paletteGrid');
  grid.innerHTML = '';
  PALETTES.forEach((p, i) => {
    const card = document.createElement('div');
    card.className = 'palette-card' + (i === currentPalette ? ' active' : '');
    card.onclick = () => selectPalette(i);
    const preview = document.createElement('div');
    preview.className = 'palette-preview';
    [p.headerBg, p.rowBg1, p.rowBg2, p.accent].forEach(c => {
      const d = document.createElement('div');
      d.style.background = c;
      preview.appendChild(d);
    });
    const name = document.createElement('div');
    name.className = 'palette-name';
    name.textContent = p.name + (p.type === 'light' ? ' ☀' : ' 🌙');
    card.appendChild(preview);
    card.appendChild(name);
    grid.appendChild(card);
  });
}

function selectPalette(i) {
  currentPalette = i;
  document.querySelectorAll('.palette-card').forEach((c, j) => c.classList.toggle('active', j === i));
  buildTableStyleGrid();
  if (tableData) renderTable();
}

function buildTableStyleGrid() {
  const grid = document.getElementById('tablestyleGrid');
  grid.innerHTML = '';
  const pal = PALETTES[currentPalette];
  TABLE_STYLES.forEach((s, i) => {
    const card = document.createElement('div');
    card.className = 'tablestyle-card' + (i === currentStyle ? ' active' : '');
    card.onclick = () => selectTableStyle(i);
    const icon = document.createElement('div');
    icon.className = 'tablestyle-icon';
    icon.innerHTML = s.icon(pal);
    const name = document.createElement('div');
    name.className = 'tablestyle-name';
    name.textContent = s.name;
    card.appendChild(icon);
    card.appendChild(name);
    grid.appendChild(card);
  });
}

function selectTableStyle(i) {
  currentStyle = i;
  document.querySelectorAll('.tablestyle-card').forEach((c, j) => c.classList.toggle('active', j === i));
  if (tableData) renderTable();
}

function getTitle() {
  return document.getElementById('titleInput').value.trim();
}

function onTitleChange() {
  if (tableData) renderTable();
}

// ── Parse ──
function parseData(input) {
  let parsed = JSON.parse(input);
  if (!Array.isArray(parsed)) throw new Error('请输入 JSON 数组');
  if (parsed.length === 0) throw new Error('数组不能为空');
  // Normalize: each item should be an object
  return parsed.map((item, i) => {
    if (typeof item === 'number' || typeof item === 'string') {
      return { '#': i + 1, '值': item };
    }
    if (Array.isArray(item)) {
      const obj = {};
      item.forEach((v, j) => { obj[`列${j+1}`] = v; });
      return obj;
    }
    if (typeof item === 'object' && item !== null) return item;
    return { '#': i + 1, '值': String(item) };
  });
}

// ── Build Table HTML ──
function buildTableHTML(data, title, pal, styleIdx, isFullscreen) {
  if (!data || data.length === 0) return '<p>无数据</p>';

  // Collect all keys in order
  const keys = [];
  const keySet = new Set();
  data.forEach(row => {
    Object.keys(row).forEach(k => {
      if (!keySet.has(k)) { keySet.add(k); keys.push(k); }
    });
  });

  const style = TABLE_STYLES[styleIdx];
  const table = document.createElement('table');
  table.className = 'gen-table';

  // Build style CSS
  const styleCSS = style.apply(table, pal);

  // Build HTML string
  let html = '';

  // Title
  if (title) {
    html += `<div class="table-title" style="color:${pal.headerText};font-size:${isFullscreen ? '1.4rem' : '1.1rem'};">${title}</div>`;
  }

  // Style tag
  html += `<style>${styleCSS}</style>`;

  // Table
  html += '<table class="gen-table">';

  // Thead
  html += '<thead><tr>';
  keys.forEach(k => {
    html += `<th>${k}</th>`;
  });
  html += '</tr></thead>';

  // Tbody
  html += '<tbody>';
  data.forEach(row => {
    html += '<tr>';
    keys.forEach(k => {
      const val = row[k] !== undefined ? row[k] : '';
      html += `<td>${val}</td>`;
    });
    html += '</tr>';
  });
  html += '</tbody></table>';

  return html;
}

// ── Render ──
function renderTable() {
  const errEl = document.getElementById('errorMsg');
  const empty = document.getElementById('emptyState');
  const content = document.getElementById('tableContent');
  const toolbar = document.getElementById('tableToolbar');
  const statsBar = document.getElementById('statsBar');
  const disclaimer = document.getElementById('tableDisclaimer');
  const wrapper = document.getElementById('tableWrapper');

  try {
    errEl.textContent = '';
    const input = document.getElementById('jsonInput').value.trim();
    if (!input) { errEl.textContent = '请输入数据'; return; }
    tableData = parseData(input);

    const pal = PALETTES[currentPalette];
    const title = getTitle();

    // Set wrapper background
    wrapper.style.background = pal.bg;
    wrapper.style.borderRadius = '8px';
    wrapper.style.padding = '16px';

    // Build table
    content.innerHTML = buildTableHTML(tableData, title, pal, currentStyle, false);

    empty.style.display = 'none';
    content.style.display = 'block';
    toolbar.style.display = 'flex';
    disclaimer.style.display = 'block';
    disclaimer.style.color = pal.headerText;
    disclaimer.style.opacity = '0.45';

    updateStats();
  } catch(e) {
    errEl.textContent = e.message;
    tableData = null;
  }
}

function updateStats() {
  if (!tableData) return;
  const keys = new Set();
  tableData.forEach(row => Object.keys(row).forEach(k => keys.add(k)));
  const keyArr = [...keys];
  let numCols = 0;
  keyArr.forEach(k => {
    if (tableData.some(row => typeof row[k] === 'number')) numCols++;
  });

  document.getElementById('statRows').textContent = tableData.length;
  document.getElementById('statCols').textContent = keyArr.length;
  document.getElementById('statNumCols').textContent = numCols;
  document.getElementById('statFields').textContent = keyArr.length > 4
    ? keyArr.slice(0, 4).join(', ') + '…'
    : keyArr.join(', ');
}

// ── Fullscreen ──
let fsHideTimer = null;

function showFsHeader() {
  const header = document.querySelector('#fullscreenWrapper .fullscreen-header');
  header.classList.remove('auto-hide');
  clearTimeout(fsHideTimer);
  fsHideTimer = setTimeout(() => {
    if (isFullscreen) header.classList.add('auto-hide');
  }, 3000);
}

function enterFullscreen() {
  const wrapper = document.getElementById('fullscreenWrapper');
  isFullscreen = true;
  wrapper.classList.add('active');
  const pal = PALETTES[currentPalette];
  const title = getTitle();
  const content = document.getElementById('fsContent');
  wrapper.style.background = pal.bg;
  content.innerHTML = buildTableHTML(tableData, title, pal, currentStyle, true)
    + `<div class="table-disclaimer" style="text-align:right;font-size:.68rem;color:${pal.headerText};margin-top:10px;opacity:.45;">* 数据来源于网络，仅供参考</div>`;
  // Try native fullscreen API (hides browser chrome on desktop & mobile)
  const el = wrapper;
  const req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
  if (req) {
    try { req.call(el); } catch(e) {}
  }
  // Auto-hide header after 3s
  showFsHeader();
  wrapper.addEventListener('mousemove', showFsHeader);
  wrapper.addEventListener('click', showFsHeader);
  wrapper.addEventListener('touchstart', showFsHeader);
}

function exitFullscreen() {
  isFullscreen = false;
  clearTimeout(fsHideTimer);
  const wrapper = document.getElementById('fullscreenWrapper');
  wrapper.classList.remove('active');
  wrapper.removeEventListener('mousemove', showFsHeader);
  wrapper.removeEventListener('click', showFsHeader);
  wrapper.removeEventListener('touchstart', showFsHeader);
  const header = document.querySelector('#fullscreenWrapper .fullscreen-header');
  header.classList.remove('auto-hide');
  const exit = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
  if (exit) {
    try { exit.call(document); } catch(e) {}
  }
}

function toggleFullscreen() {
  if (isFullscreen) {
    exitFullscreen();
  } else {
    enterFullscreen();
  }
}

// Sync state when user exits via browser controls (ESC, gesture, etc.)
function onFullscreenChange() {
  const fsEl = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;
  if (!fsEl && isFullscreen) {
    isFullscreen = false;
    document.getElementById('fullscreenWrapper').classList.remove('active');
  }
}
document.addEventListener('fullscreenchange', onFullscreenChange);
document.addEventListener('webkitfullscreenchange', onFullscreenChange);
document.addEventListener('mozfullscreenchange', onFullscreenChange);
document.addEventListener('MSFullscreenChange', onFullscreenChange);

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && isFullscreen) exitFullscreen();
});

// ── Init ──
init();
</script>
