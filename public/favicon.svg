<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- 中式锦囊 - 扁平线条风格 -->

  <!-- 顶部系带/束口 -->
  <path d="M13,8 Q16,3 19,8" fill="none" stroke="#E8453C" stroke-width="1.6" stroke-linecap="round"/>
  <!-- 左系绳 -->
  <path d="M13.5,8.5 Q11,5 9.5,3" fill="none" stroke="#D4A853" stroke-width="1.3" stroke-linecap="round"/>
  <!-- 右系绳 -->
  <path d="M18.5,8.5 Q21,5 22.5,3" fill="none" stroke="#D4A853" stroke-width="1.3" stroke-linecap="round"/>

  <!-- 锦囊主体 - 上部束口褶皱 -->
  <path d="M11.5,10 Q13,8 16,8.5 Q19,8 20.5,10" fill="#E8453C" stroke="#C73630" stroke-width="1"/>

  <!-- 锦囊主体 - 圆润的袋身 -->
  <path d="M11.5,10 Q8,14 8,20 Q8,27 16,28 Q24,27 24,20 Q24,14 20.5,10 Z"
        fill="#E8453C" stroke="#C73630" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- 锦囊装饰纹 - 中心如意/福纹 -->
  <path d="M14,17 Q16,15 18,17" fill="none" stroke="#FFD966" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M14,20 Q16,22 18,20" fill="none" stroke="#FFD966" stroke-width="1.3" stroke-linecap="round"/>
  <circle cx="16" cy="18.5" r="1.2" fill="#FFD966"/>

  <!-- 底部穗子 -->
  <line x1="14" y1="28" x2="13.5" y2="31" stroke="#D4A853" stroke-width="1" stroke-linecap="round"/>
  <line x1="16" y1="28.2" x2="16" y2="31.5" stroke="#D4A853" stroke-width="1" stroke-linecap="round"/>
  <line x1="18" y1="28" x2="18.5" y2="31" stroke="#D4A853" stroke-width="1" stroke-linecap="round"/>

  <!-- 束口绑绳横带 -->
  <path d="M11,10.5 Q16,12 21,10.5" fill="none" stroke="#FFD966" stroke-width="1.4" stroke-linecap="round"/>
</svg>
